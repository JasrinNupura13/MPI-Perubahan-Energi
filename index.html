<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROBO-ENERGI: Misi Menyalakan Kota Energi</title>
<style>
:root{
  --navy:#0b2a6f; --blue:#2f7bff; --sky:#cfe8ff; --sky2:#e8f4ff; --yellow:#ffd23f; --white:#fff;
  --ok:#0a7d3b; --bad:#b3261e;
  --e-listrik:#ffd23f; --e-cahaya:#fff4b8; --e-panas:#ffa24a; --e-gerak:#8fe388; --e-bunyi:#d3b4ff; --e-kimia:#ffb3d1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--navy);
  font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;font-size:clamp(20px,1.7vw,28px);line-height:1.5}
#app{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px;box-shadow:0 0 0 7px var(--navy)}
h1,h2,h3{margin:.2em 0;line-height:1.2}
h1{font-size:clamp(28px,3vw,40px)}
h2{font-size:clamp(24px,2.4vw,34px)}
.btn{background:var(--yellow);color:var(--navy);border:4px solid var(--navy);border-radius:18px;padding:.45em 1em;font-weight:700;
  box-shadow:0 5px 0 var(--navy);transition:transform .1s}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.btn.sm{padding:.15em .6em;font-size:.8em;border-radius:12px;box-shadow:0 3px 0 var(--navy)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:#fff}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--navy);color:#fff;padding:8px 16px}
.bar .btn{border-color:#fff;box-shadow:0 3px 0 #000}
.bar .chip{background:#fff;color:var(--navy);padding:.1em .7em;border-radius:999px;font-weight:700}
.bar .sp{flex:1}
main{flex:1;padding:16px clamp(12px,3vw,40px) 24px;max-width:1280px;width:100%;margin:0 auto}
.card{background:#fff;border:4px solid var(--navy);border-radius:22px;padding:18px 22px;box-shadow:0 6px 0 var(--navy)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
.grow{flex:1 1 280px}
.center{text-align:center}
.muted{opacity:.85}
.robi{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
.bubble{position:relative;background:#fff;border:4px solid var(--navy);border-radius:20px;padding:10px 18px;flex:1;max-width:860px;font-weight:600}
.bubble:before{content:"";position:absolute;left:-18px;bottom:22px;border:10px solid transparent;border-right:14px solid var(--navy)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.5em 1.2em;border-radius:16px;border:3px solid var(--yellow);z-index:50;max-width:90vw}
/* opening */
.open{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#071b4d,#0b2a6f 60%,#1d4fb5)}
.open #city{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.open .w{fill:#16357f;transition:fill .6s}
.open #city.on .w{fill:var(--yellow)}
.open #city.on .w:nth-child(3n){transition-delay:.3s} .open #city.on .w:nth-child(3n+1){transition-delay:.6s}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--yellow);animation:tw 3s infinite}
@keyframes tw{50%{opacity:.25}}
.open-c{position:relative;z-index:2;text-align:center;color:#fff;padding:20px;max-width:900px}
.logo{font-size:clamp(44px,7vw,92px);font-weight:800;color:var(--yellow);text-shadow:0 5px 0 #000;letter-spacing:2px}
.sub{font-size:clamp(22px,2.6vw,36px);margin:0 0 6px}
.open .bub{background:#fff;color:var(--navy);border:4px solid var(--navy);border-radius:20px;padding:10px 20px;display:inline-block;font-weight:700;margin:6px 0 18px}
.start{font-size:clamp(34px,4vw,56px);padding:.3em 1.6em;letter-spacing:3px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.credit{font-size:.7em;opacity:.9;margin-top:22px}
/* menu */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:14px 0}
.bld{background:#fff;border:4px solid var(--navy);border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 var(--navy)}
.bld .em{font-size:3em;line-height:1.1}
.bld.locked{background:#c9d3e6;filter:grayscale(.8)}
.bld.done{background:#fff7cc}
.bld:hover:not(.locked){transform:translateY(-3px)}
.lamps{display:flex;gap:8px;font-size:1.6em}
.lamps span{opacity:.3;filter:grayscale(1)} .lamps span.on{opacity:1;filter:none}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* energy chips */
.en{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--navy);border-radius:999px;padding:.05em .7em;font-weight:700;background:#fff}
.en.listrik{background:var(--e-listrik)} .en.cahaya{background:var(--e-cahaya)} .en.panas{background:var(--e-panas)}
.en.gerak{background:var(--e-gerak)} .en.bunyi{background:var(--e-bunyi)} .en.kimia{background:var(--e-kimia)}
.pick{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.pick button{border:4px solid var(--navy);border-radius:16px;padding:.25em .8em;font-weight:700;background:#fff}
.pick button.listrik{background:var(--e-listrik)} .pick button.cahaya{background:var(--e-cahaya)} .pick button.panas{background:var(--e-panas)}
.pick button.gerak{background:var(--e-gerak)} .pick button.bunyi{background:var(--e-bunyi)} .pick button.kimia{background:var(--e-kimia)}
.pick button[aria-pressed="true"]{outline:5px solid var(--navy);outline-offset:2px;transform:scale(1.05)}
.pick button[aria-pressed="true"]:after{content:" ✔"}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.item{background:#fff;border:4px solid var(--navy);border-radius:20px;padding:12px;text-align:center;font-weight:700;box-shadow:0 5px 0 var(--navy)}
.item .em{font-size:3.2em;line-height:1.1;display:block}
.item.ok{background:#d9f7e3;border-color:var(--ok)}
.item.miss{background:#ffe1de;border-color:var(--bad)}
.item.sel{outline:6px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 10px var(--navy)}
.item small{display:block;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(7,27,77,.75);display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
.modal .card{max-width:820px;width:100%;max-height:92vh;overflow:auto}
.fb{border:4px solid var(--navy);border-radius:16px;padding:8px 14px;margin:10px 0;font-weight:700}
.fb.ok{background:#d9f7e3;border-color:var(--ok)} .fb.no{background:#ffe9d6;border-color:#c25b00}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0;font-weight:700}
.arrow{font-size:1.4em}
.slots{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:10px 0}
.slot{min-width:150px;min-height:92px;border:4px dashed var(--navy);border-radius:18px;background:#fff;padding:8px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-weight:700}
.slot.filled{border-style:solid;background:#fff7cc}
.slot.bad{background:#ffe1de;border-color:var(--bad)}
.slot.good{background:#d9f7e3;border-color:var(--ok)}
.slot .no{font-size:.8em;opacity:.8}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.cards button{border:4px solid var(--navy);border-radius:16px;background:#fff;padding:.4em .9em;font-weight:700;box-shadow:0 4px 0 var(--navy)}
.opts{display:grid;gap:12px;margin:12px 0}
.opts button{text-align:left;border:4px solid var(--navy);border-radius:16px;background:#fff;padding:.45em 1em;font-weight:600;box-shadow:0 4px 0 var(--navy)}
.opts button[aria-pressed="true"]{background:var(--yellow)}
.opts button.right{background:#d9f7e3;border-color:var(--ok)} .opts button.wrong{background:#ffe1de;border-color:var(--bad)}
.opts button .k{display:inline-block;width:1.8em;height:1.8em;line-height:1.6em;text-align:center;border-radius:50%;background:var(--navy);color:#fff;margin-right:.6em}
.prog{height:18px;background:#fff;border:3px solid var(--navy);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--blue)}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--navy)} .dots i.on{background:var(--yellow)}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:3px solid var(--navy);padding:.3em .6em;text-align:left;font-size:.85em}
th{background:var(--navy);color:#fff}
tr.r-ok td:first-child{background:#d9f7e3} tr.r-no td:first-child{background:#ffe1de}
.score{font-size:clamp(60px,9vw,120px);font-weight:800;line-height:1}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.stage{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;margin:10px 0}
.lab-box{background:#fff;border:4px solid var(--navy);border-radius:20px;padding:10px 16px;min-width:150px;text-align:center;font-weight:700}
.glow{animation:glow 1s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 14px #ffd23f);transform:scale(1.12)}}
.spin{display:inline-block;animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.bounce{display:inline-block;animation:bnc .5s infinite alternate}
@keyframes bnc{to{transform:translateY(-8px)}}
/* AR lite */
.ar{position:relative;height:min(60vh,520px);border:4px solid var(--navy);border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#8fb8ff,#e8f4ff 55%,#c9e8c0)}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .floater{position:absolute;font-size:4.5em;background:rgba(255,255,255,.85);border:4px solid var(--navy);border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;animation:flt 2.4s ease-in-out infinite alternate}
.ar .floater:nth-of-type(2){animation-delay:.6s} .ar .floater:nth-of-type(3){animation-delay:1.2s}
@keyframes flt{to{transform:translateY(-18px) rotate(6deg)}}
.ar .label{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border:4px solid var(--navy);border-radius:16px;padding:8px 14px;font-weight:700}
body.calm *,body.calm *:before,body.calm *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media (max-width:640px){.bubble:before{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
"use strict";
/* ==========================================================
   ROBO-ENERGI: Misi Menyalakan Kota Energi
   IPAS Kelas 4 - Perubahan Energi di Sekitar Kita
   Satu file HTML mandiri (tanpa internet).
   ========================================================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function say(t){ const l = $('#live'); l.textContent = ''; setTimeout(() => l.textContent = t, 60); }

/* ---------- Fullscreen API (dipicu tombol START) ---------- */
function enterFullscreen(){
  const el = document.documentElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!request) return Promise.resolve(false);
  try { return Promise.resolve(request.call(el)).then(() => true).catch(() => false); }
  catch (e) { return Promise.resolve(false); }
}
function exitFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (ex && isFs()) { try { ex.call(document); } catch (e) {} }
}
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function updateFsBtn(){ const b = $('#bFs'); if (b) b.textContent = isFs() ? '⛶ Keluar Layar Penuh' : '⛶ Layar Penuh'; }
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

/* ---------- Suara sederhana ---------- */
let mute = false, calm = false, ac = null;
function beep(f, d = .12, type = 'sine', delay = 0){
  if (mute) return;
  setTimeout(() => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f; g.gain.value = .07;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }, delay);
}
const sfx = {
  click: () => beep(440, .05),
  ok: () => { beep(660); beep(880, .15, 'sine', 110); },
  no: () => beep(180, .22, 'square'),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, .16, 'triangle', i * 130)); },
  on: () => beep(300, .5, 'sawtooth')
};

/* ---------- Data energi ---------- */
const EN = {
  listrik: {n: 'Listrik', i: '⚡'}, cahaya: {n: 'Cahaya', i: '💡'}, panas: {n: 'Panas', i: '🔥'},
  gerak: {n: 'Gerak', i: '🌀'}, bunyi: {n: 'Bunyi', i: '🔊'}, kimia: {n: 'Kimia', i: '🧪'}
};
const enChip = k => `<span class="en ${k}"><span aria-hidden="true">${EN[k].i}</span>${EN[k].n}</span>`;

const MISI = {
  m1: {n: 'Detektif Energi', e: '🏠', t: 'Rumah Detektif', badge: 'Detektif Energi'},
  m2: {n: 'Lab Mesin Pengubah Energi', e: '🔬', t: 'Laboratorium', badge: 'Ilmuwan Lab'},
  m3: {n: 'Rantai Energi', e: '🚂', t: 'Pembangkit', badge: 'Perangkai Rantai'},
  m4: {n: 'Manfaat dan Dampak', e: '🌳', t: 'Taman Manfaat', badge: 'Penjaga Energi'},
  m5: {n: 'Jelajah AR', e: '📡', t: 'Menara AR', badge: 'Penjelajah AR'}
};

/* ---------- Status permainan ---------- */
const blank = () => ({materi: false, misi: {}, badges: [], hasil: null});
let S = blank();
let cur = 'pembuka', helpText = '';
let camStream = null;

function totals(){
  let skor = 0, bint = 0;
  Object.values(S.misi).forEach(m => { skor += m.pts; bint += m.stars; });
  return {skor, bint};
}
const passed = k => !!(S.misi[k] && S.misi[k].pass);

/* ---------- Kerangka tampilan ---------- */
function robi(mood = 'senang', size = 120){
  const mouths = {senang: 'M44 70 Q60 82 76 70', semangat: 'M40 68 Q60 90 80 68', berpikir: 'M46 74 L74 74', sedih: 'M46 78 Q60 66 74 78'};
  return `<svg viewBox="0 0 120 150" width="${size}" height="${size * 1.25}" role="img" aria-label="Robi, robot pembimbing">
  <line x1="60" y1="8" x2="60" y2="26" stroke="#0b2a6f" stroke-width="5"/>
  <circle cx="60" cy="8" r="8" fill="#ffd23f" stroke="#0b2a6f" stroke-width="3"/>
  <rect x="18" y="26" width="84" height="70" rx="22" fill="#2f7bff" stroke="#0b2a6f" stroke-width="5"/>
  <rect x="30" y="38" width="60" height="46" rx="14" fill="#cfe8ff" stroke="#0b2a6f" stroke-width="3"/>
  <circle cx="48" cy="54" r="6" fill="#0b2a6f"/><circle cx="72" cy="54" r="6" fill="#0b2a6f"/>
  <path d="${mouths[mood] || mouths.senang}" fill="none" stroke="#0b2a6f" stroke-width="4" stroke-linecap="round"/>
  <rect x="32" y="100" width="56" height="40" rx="12" fill="#2f7bff" stroke="#0b2a6f" stroke-width="5"/>
  <circle cx="60" cy="120" r="8" fill="#ffd23f" stroke="#0b2a6f" stroke-width="3"/></svg>`;
}
function robiSay(text, mood = 'senang', id = 'robiMsg'){
  return `<div class="robi">${robi(mood, 90)}<div class="bubble" id="${id}" role="status">${text}</div></div>`;
}
function setRobi(text, mood){
  const b = $('#robiMsg'); if (!b) return;
  b.innerHTML = text; say(b.textContent);
  if (mood){ const svg = b.parentElement.querySelector('svg'); if (svg) { const t = document.createElement('div'); t.innerHTML = robi(mood, 90); svg.replaceWith(t.firstChild); } }
}
function bar(){
  const t = totals();
  return `<header class="bar" role="banner">
    <button class="btn sm" data-a="menu">🏠 Menu</button>
    <span class="chip">⭐ Bintang: ${t.bint}</span><span class="chip">🏆 Skor: ${t.skor}</span>
    <span class="sp"></span>
    <button class="btn sm" data-a="mute" aria-pressed="${mute}">${mute ? '🔇 Suara mati' : '🔊 Suara'}</button>
    <button class="btn sm" data-a="calm" aria-pressed="${calm}">🐢 Kurangi Gerak</button>
    <button class="btn sm" data-a="fs" id="bFs">${isFs() ? '⛶ Keluar Layar Penuh' : '⛶ Layar Penuh'}</button>
    <button class="btn sm" data-a="help" aria-label="Bantuan Robi (tombol tanda tanya)">? Bantuan</button>
  </header>`;
}
function stopCam(){ if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function view(html, help, title){
  stopCam(); closeModal();
  helpText = help || '';
  app.innerHTML = bar() + `<main id="main" tabindex="-1">${html}</main>`;
  window.scrollTo(0, 0);
  const m = $('#main'); if (m) m.focus({preventScroll: true});
  if (title) say(title);
}
function toast(msg){
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
let lastFocus = null;
function openModal(html){
  closeModal();
  lastFocus = document.activeElement;
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  document.body.appendChild(m);
  const c = m.querySelector('.card'); c.focus();
  return c;
}
function closeModal(){
  const m = $('#modal'); if (m){ m.remove(); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '?' && cur !== 'pembuka' && !/INPUT|TEXTAREA/.test(e.target.tagName)) actions.help();
});

/* ---------- Aksi global (delegasi klik) ---------- */
const actions = {
  menu: () => menu(),
  mute: b => { mute = !mute; sfx.click(); const x = $('[data-a="mute"]'); if (x){ x.setAttribute('aria-pressed', mute); x.textContent = mute ? '🔇 Suara mati' : '🔊 Suara'; } },
  calm: () => { calm = !calm; document.body.classList.toggle('calm', calm); const x = $('[data-a="calm"]'); if (x) x.setAttribute('aria-pressed', calm); },
  fs: () => { isFs() ? exitFullscreen() : enterFullscreen(); },
  help: () => {
    const c = openModal(`<h2>Bantuan Robi 🤖</h2><p>${helpText || 'Klik atau tekan Enter pada tombol. Tombol Tab untuk berpindah, Esc untuk menutup.'}</p>
      <p class="muted">Tips: Tab = pindah tombol, Enter atau Spasi = pilih, Esc = tutup jendela.</p>
      <button class="btn" data-a="close">Mengerti!</button>`);
  },
  close: () => closeModal()
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.getAttribute('aria-disabled') === 'true') return;
  const f = actions[b.dataset.a];
  if (f){ sfx.click(); f(b); }
});

/* ==========================================================
   P1. HALAMAN PEMBUKA
   ========================================================== */
function pembuka(){
  cur = 'pembuka'; helpText = '';
  let wins = '', bld = '', x = 0;
  const hs = [90, 140, 110, 170, 120, 150, 100, 160, 130, 110];
  hs.forEach((h, i) => {
    const w = 72; bld += `<rect x="${x}" y="${200 - h}" width="${w}" height="${h}" fill="#08205a"/>`;
    for (let r = 0; r < Math.floor(h / 34); r++) for (let c = 0; c < 2; c++)
      wins += `<rect class="w" x="${x + 10 + c * 30}" y="${200 - h + 10 + r * 34}" width="20" height="20" rx="3"/>`;
    x += w + 8;
  });
  let st = ''; for (let i = 0; i < 26; i++) st += `<i style="left:${(i * 37) % 100}%;top:${(i * 53) % 55}%;animation-delay:${(i % 7) * .4}s"></i>`;
  app.innerHTML = `<section class="open" aria-labelledby="judul">
    <div class="stars" aria-hidden="true">${st}</div>
    <svg id="city" viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${bld}${wins}</svg>
    <div class="open-c">
      <div class="logo" id="judul">ROBO-ENERGI</div>
      <p class="sub">Misi Menyalakan Kota Energi</p>
      <div>${robi('berpikir', 150)}</div>

function finishMisi(k, pts, max, force){
  const r = pts / max;
  let stars = r >= 1 ? 3 : r >= .8 ? 2 : r >= .6 ? 1 : 0;
  if (force === true && stars === 0) stars = 1;
  if (force === false) stars = 0;
  const pass = stars > 0;
  S.misi[k] = {pts, max, stars, pass};
  if (pass && !S.badges.includes(MISI[k].badge)) S.badges.push(MISI[k].badge);
  pass ? sfx.win() : sfx.no();
  rekap(k);
}
function rekap(k){

}

actions.m2t = b => { M2.t = b.dataset.v; M2.res = null; m2View(); };
actions.m2on = () => {
  if (!M2.s || !M2.t){ toast('Pilih sumber energi dan alat dulu!'); sfx.no(); return; }

  if (!outs){ M2.res = {bad: true}; sfx.no(); m2View(); return; }
  const key = M2.s + '-' + M2.t, isNew = !M2.found.some(f => f.key === key);
  const s = SRC.find(x => x.id === M2.s), t = TOOL.find(x => x.id === M2.t);
  if (isNew){ M2.found.push({key, i: s.i, sn: s.n, tn: t.n, outs}); if (M2.found.length <= 3) M2.pts += 15; }
  M2.res = {outs, isNew}; sfx.ok(); m2View();

};

const LV3 = [

let M3 = null;
function misi3(){ M3 = {lv: 0, placed: [], pts: 0, tries: 0, chk: null, order: shuffle([0, 1, 2, 3, 4].slice(0, 4))}; m3Init(); m3View(); }
function m3Init(){ const n = LV3[M3.lv].c.length; M3.placed = []; M3.tries = 0; M3.chk = null; M3.order = shuffle([...Array(n).keys()]); }
function m3View(){
  cur = 'm3';
  const L = LV3[M3.lv], n = L.c.length;
  const slots = [...Array(n).keys()].map(i => {
    const p = M3.placed[i], st = M3.chk ? (M3.chk[i] ? 'good' : 'bad') : '';
    return p === undefined ? `<div class="slot"><span class="no">Gerbong ${i + 1}</span>kosong</div>`
      : `<button class="slot filled ${st}" data-a="m3rm" data-v="${i}" aria-label="Gerbong ${i + 1}: ${L.c[p]}. Klik untuk mengeluarkan"><span class="no">Gerbong ${i + 1}</span>${L.c[p]}</button>`;
  }).join('');
  const avail = M3.order.filter(i => !M3.placed.includes(i));
  view(`<h1>Misi 3: Rantai Energi 🚂</h1>
    <h2>Level ${M3.lv + 1} dari 3: ${L.t}</h2>
    <p>Klik kartu untuk memasukkannya ke gerbong berurutan dari kiri. Klik gerbong untuk mengeluarkan kartu.</p>
    <div class="slots" role="list">${slots}</div>
    <div class="cards" aria-label="Kartu energi">${avail.map(i => `<button data-a="m3add" data-v="${i}">${L.c[i]}</button>`).join('')}</div>
    <p><button class="btn blue" data-a="m3cek" ${M3.placed.length < n ? 'aria-disabled="true"' : ''}>Cek Rantai ✔</button></p>
    <div id="m3fb" role="status"></div>
    ${robiSay('Urutkan dari awal sampai akhir. Energi selalu mengalir satu arah!', 'berpikir')}`,
    'Klik kartu untuk mengisi gerbong dari kiri ke kanan. Klik gerbong untuk membatalkan. Tekan Cek Rantai kalau semua gerbong terisi.', 'Misi 3 Rantai Energi');
}
actions.m3add = b => { M3.placed.push(+b.dataset.v); M3.chk = null; m3View(); };
actions.m3rm = b => { M3.placed.splice(+b.dataset.v, 1); M3.chk = null; m3View(); };
actions.m3cek = () => {
  const L = LV3[M3.lv], n = L.c.length;
  if (M3.placed.length < n){ toast('Isi semua gerbong dulu ya!'); return; }
  const chk = M3.placed.map((p, i) => p === i);
  if (chk.every(Boolean)){
    const p = M3.tries === 0 ? 20 : 10; M3.pts += p; sfx.ok();
    M3.chk = chk; m3View();
    const fb = $('#m3fb'); fb.innerHTML = `<div class="fb ok">Rantai benar! 🚂 Kereta melaju! +${p} poin</div>
      <button class="btn blue" data-a="m3next">${M3.lv < 2 ? 'Level Berikutnya ▶' : 'Selesaikan Misi ✔'}</button>`;
    say('Rantai benar'); $('[data-a="m3next"]').focus();
  } else {
    M3.tries++; M3.chk = chk; sfx.no(); m3View();

    $('#m3fb').innerHTML = `<div class="fb no">Gerbong ${first + 1} belum tepat. 💭 ${L.h}</div>`;
    say('Gerbong ' + (first + 1) + ' belum tepat');
  }
};
actions.m3next = () => {
  if (M3.lv < 2){ M3.lv++; m3Init(); m3View(); } else finishMisi('m3', M3.pts, 60);
};

    <div class="card"><ul><li>10 soal pilihan ganda, dikerjakan sendiri.</li><li>Nilai minimal <strong>80</strong> untuk lulus.</li><li>Benar atau salah baru ditunjukkan <strong>setelah semua soal dikirim</strong>.</li><li>Kamu boleh kembali ke soal sebelumnya sebelum mengirim.</li></ul></div>
    ${robiSay('Tarik napas dalam-dalam. Kamu sudah belajar banyak. Semangat, Agen Energi!', 'semangat')}
    <p class="row"><button class="btn blue" data-a="asStart">Mulai ▶</button><button class="btn ghost" data-a="menu">Kembali</button></p>`,
    'Baca aturan lalu tekan Mulai.', 'Asesmen akhir');
}
actions.asStart = () => {
  A = {i: 0, ans: Array(10).fill(null), ord: ASES.map(q => shuffle([0, 1, 2, 3].slice(0, q.o.length)))};
  asView();
};
function asView(){
  cur = 'ases';
  const q = ASES[A.i], ord = A.ord[A.i];
  view(`<h1>Asesmen Akhir: Soal ${A.i + 1} dari 10</h1>
    <div class="prog" aria-hidden="true"><i style="width:${(A.i + 1) / 10 * 100}%"></i></div>
    <div class="card"><h2>${q.q}</h2>
      <div class="opts" role="group" aria-label="Pilihan jawaban">${ord.map((oi, pos) => `<button data-a="asPick" data-v="${oi}" aria-pressed="${A.ans[A.i] === oi}"><span class="k">${'ABCD'[pos]}</span>${q.o[oi]}</button>`).join('')}</div></div>
    <p class="row" style="margin-top:14px">
      <button class="btn ghost" data-a="asPrev" ${A.i === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
      ${A.i < 9 ? '<button class="btn" data-a="asNext">Soal Berikutnya ▶</button>' : '<button class="btn blue" data-a="asSend">Kirim Jawaban ✔</button>'}
    </p>
    <div class="dots" aria-label="Soal terjawab">${A.ans.map((v, i) => `<i class="${v !== null ? 'on' : ''}" ${i === A.i ? 'style="outline:3px solid #2f7bff"' : ''}></i>`).join('')}</div>`,
    'Pilih satu jawaban. Kamu boleh kembali ke soal sebelumnya. Di soal 10 tekan Kirim Jawaban.', 'Soal ' + (A.i + 1));
}
actions.asPick = b => { A.ans[A.i] = +b.dataset.v; asView(); const x = document.querySelector('[aria-pressed="true"][data-a="asPick"]'); if (x) x.focus(); };
actions.asNext = () => { A.i++; asView(); };
actions.asPrev = () => { A.i--; asView(); };
actions.asSend = () => {
  const un = A.ans.map((v, i) => v === null ? i + 1 : null).filter(Boolean);
  if (un.length){
    openModal(`<h2>Masih ada soal kosong</h2><p>Soal nomor: <strong>${un.join(', ')}</strong>. Kirim sekarang atau periksa dulu?</p>
      <p class="row"><button class="btn" data-a="asGo" data-v="${un[0] - 1}">Periksa dulu</button><button class="btn blue" data-a="asFinal">Kirim saja</button></p>`);
    return;
  }
  actions.asFinal();
};
actions.asGo = b => { closeModal(); A.i = +b.dataset.v; asView(); };
actions.asFinal = () => { closeModal(); hasil(); };
function hasil(){
  cur = 'hasil';
  const benar = ASES.filter((q, i) => A.ans[i] === q.a).length, nilai = benar * 10, lulus = nilai >= 80;
  S.hasil = {nilai, lulus};
  if (lulus && !S.badges.includes('Agen Energi')) S.badges.push('Agen Energi');
  lulus ? sfx.win() : sfx.no();
  const msg = nilai === 100 ? 'Sempurna! Kamu Agen Energi Super! 🌟' : nilai >= 80 ? 'Hebat! Kamu lulus dan Kota Energi menyala terang! 🏙️' : nilai >= 60 ? 'Sedikit lagi! Ayo ulang Misi 2 dan 3, lalu coba lagi.' : 'Tidak apa-apa, Agen. Mari belajar bersama lagi mulai dari Materi.';
  const ulang = ['m2', 'm3'];
  view(`<h1>Hasil Asesmen Akhir</h1>
    <div class="card center">
      <div class="score ${lulus ? 'pass' : 'fail'}">${nilai}</div>
      <h2 class="${lulus ? 'pass' : 'fail'}">${lulus ? '✅ LULUS' : '❌ BELUM LULUS'}</h2>
      <p>${benar} dari 10 soal benar. Syarat lulus: nilai minimal 80.</p>
      ${lulus ? '<div style="font-size:2.4em" aria-hidden="true">🏆🎉🏙️</div><p><strong>Sertifikat:</strong> Agen Energi telah menyalakan Kota Energi!</p>' : ''}
    </div>
    ${robiSay(msg, lulus ? 'semangat' : 'senang')}
    ${S.badges.length ? `<p><strong>Lencanamu:</strong> ${S.badges.map(b => '🏅 ' + b).join(' · ')}</p>` : ''}
    ${lulus ? '' : `<p>Saran: ulangi ${ulang.map(k => 'Misi ' + k.slice(1) + ' (' + MISI[k].n + ')').join(' dan ')}, lalu coba asesmen lagi.</p>`}
    <h2>Pembahasan</h2>
    <table><tr><th>No</th><th>Jawabanmu</th><th>Kunci</th><th>Penjelasan</th></tr>
    ${ASES.map((q, i) => { const ok = A.ans[i] === q.a; return `<tr class="${ok ? 'r-ok' : 'r-no'}"><td>${i + 1} ${ok ? '✔' : '✖'}</td><td>${A.ans[i] === null ? '(kosong)' : q.o[A.ans[i]]}</td><td>${q.o[q.a]}</td><td>${q.ex}</td></tr>`; }).join('')}</table>
    <div class="card" style="margin-top:14px"><h3>🏅 Simpan ke Peringkat Kelas</h3>
      <label for="nick">Nama julukan (bukan nama asli):</label><br>
      <input id="nick" maxlength="16" style="font:inherit;padding:.3em .6em;border:4px solid #0b2a6f;border-radius:12px;max-width:100%">
      <button class="btn" data-a="saveRank">Simpan</button></div>
    <p class="row" style="margin-top:14px">
      <button class="btn blue" data-a="asesmen">🔁 Ulangi Asesmen</button>
      <button class="btn" data-a="menu">🏠 Menu</button>
      <button class="btn ghost" data-a="reset">🎮 Main dari Awal</button>
      <button class="btn ghost" data-a="exitFs">⛶ Keluar Layar Penuh</button></p>`,
    'Lihat nilai dan pembahasan. Tekan Ulangi Asesmen jika belum lulus.', 'Hasil asesmen ' + nilai);
}
actions.exitFs = () => exitFullscreen();
actions.reset = () => { S = blank(); menu(); };

/* ---------- Peringkat kelas (disimpan lokal) ---------- */
function loadRank(){ try { return JSON.parse(localStorage.getItem('roboenergi_rank') || '[]'); } catch (e) { return []; } }
function saveRankData(r){ try { localStorage.setItem('roboenergi_rank', JSON.stringify(r)); return true; } catch (e) { return false; } }
actions.saveRank = () => {
  const n = ($('#nick').value || '').trim().slice(0, 16);
  if (!n){ toast('Tulis nama julukan dulu ya!'); return; }
  const t = totals(), r = loadRank(); r.push({n, nilai: S.hasil ? S.hasil.nilai : 0, skor: t.skor});
  r.sort((a, b) => b.nilai - a.nilai || b.skor - a.skor);
  toast(saveRankData(r.slice(0, 20)) ? 'Tersimpan di peringkat! 🏅' : 'Peringkat tidak bisa disimpan di perangkat ini.');
};
actions.rank = () => {
  const r = loadRank().slice(0, 5);
  openModal(`<h2>🏅 Peringkat Kelas</h2>${r.length ? `<table><tr><th>#</th><th>Julukan</th><th>Nilai</th><th>Skor misi</th></tr>${r.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.n)}</td><td>${x.nilai}</td><td>${x.skor}</td></tr>`).join('')}</table>` : '<p>Belum ada data. Selesaikan asesmen dan simpan namamu!</p>'}
    <p><button class="btn" data-a="close">Tutup</button></p>`);
};

/* ---------- Mulai ---------- */
pembuka();
</script>
</body>
</html>
